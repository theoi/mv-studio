name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Live smoke test
    needs: deploy
    runs-on: ubuntu-latest
    # An apt-get that hangs on a stalled mirror would otherwise hold the job for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - name: Let apt retry failed downloads
        run: echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install Chromium for Playwright
        timeout-minutes: 12
        run: for attempt in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep $((attempt * 20)); done; exit 1
      - name: Install ffmpeg (Playwright global setup generates the media fixtures)
        timeout-minutes: 12
        run: for attempt in 1 2 3; do sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && exit 0; sleep $((attempt * 20)); done; exit 1
      - name: Smoke test against the deployed site
        env:
          E2E_BASE_URL: https://theoi.github.io/mv-studio/
        run: npx playwright test tests/e2e/smoke.spec.ts
