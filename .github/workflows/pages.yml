name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Live smoke test
    needs: deploy
    runs-on: ubuntu-latest
    # An apt-get that hangs on a stalled mirror would otherwise hold the job for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - name: Give apt download retries and timeouts
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install Chromium for Playwright
        # apt-get update can hang silently on a stalled mirror. `timeout` ends a stuck attempt so the next one retries: it
        # signals its whole process group, and sudo passes the signal on to apt-get, so no apt-get is left holding the lock.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sleep $(((attempt - 1) * 20))
              # An attempt cut off during the install can leave dpkg half done.
              sudo timeout -k 10 120 dpkg --configure -a || true
            fi
            timeout -k 10 240 npx playwright install --with-deps chromium && exit 0
          done
          exit 1
      - name: Install ffmpeg (Playwright global setup generates the media fixtures)
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sleep $(((attempt - 1) * 20))
              sudo timeout -k 10 120 dpkg --configure -a || true
            fi
            sudo timeout -k 10 120 apt-get update &&
              sudo timeout -k 10 480 apt-get install -y --no-install-recommends ffmpeg &&
              exit 0
          done
          exit 1
      - name: Smoke test against the deployed site
        env:
          E2E_BASE_URL: https://theoi.github.io/mv-studio/
        run: npx playwright test tests/e2e/smoke.spec.ts
