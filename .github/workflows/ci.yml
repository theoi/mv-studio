name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run. Each push to main gets its own group, so it is neither
# cancelled nor replaced while waiting, and every main commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Previews draw in the render worker by default; the second leg runs the preview specs with the main-thread
    # fallback, which browsers without OffscreenCanvas workers (or pages opened with ?preview-worker=0) use.
    name: E2E (Chromium${{ matrix.preview == 'main' && ', main-thread preview' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preview: [worker, main]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - name: Install Chromium for Playwright
        run: for attempt in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep $((attempt * 20)); done; exit 1
      - name: Install ffmpeg (test fixtures and export verification)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build
      - if: matrix.preview == 'worker'
        run: npx playwright test
      - if: matrix.preview == 'main'
        run: npx playwright test playback vj editor-engine export-dialog design-preview preview-worker
        env:
          E2E_PREVIEW_WORKER: '0'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.preview }}
          path: |
            playwright-report
            test-results
          retention-days: 7
