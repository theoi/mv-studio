name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run, waiting or running. On main, a running run is never cancelled:
# merges land faster than a run takes, so cancelling it meant no main commit was ever tested to the end. A new main
# commit only replaces the one waiting behind the running run, so the next run tests the newest tree, which contains
# every earlier merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Previews draw in the render worker by default. The worker suite runs as two halves on separate machines
    # (E2E_HALF in playwright.config.ts). The main-thread leg runs the preview specs with the fallback that browsers
    # without OffscreenCanvas workers (or pages opened with ?preview-worker=0) use.
    name: E2E (Chromium${{ matrix.preview == 'main' && ', main-thread preview' || format(', {0} of 2', matrix.half) }})
    runs-on: ubuntu-latest
    # A leg takes about 25 minutes. Without a limit, an apt-get that hangs on a stalled mirror holds the job for six
    # hours, and with it every later push to main, which waits behind the running main run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preview: worker, half: 1 }
          - { preview: worker, half: 2 }
          - { preview: main }
    env:
      MAIN_THREAD_SPECS: playback vj editor-engine export-dialog design-preview preview-worker
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 of a pull request's merge commit is its base, for the changed-files check below.
          fetch-depth: 2
      - name: Decide whether this leg runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          LEG: ${{ matrix.preview }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && [ "$LEG" = main ]; then
            # Pull requests run the main-thread leg only when they change code that can draw or behave differently
            # there, or the test setup. Every push to main runs it.
            specs=$(printf '%s' "$MAIN_THREAD_SPECS" | tr ' ' '|')
            paths="^(src/(engine|shared|media|testing|export|vj)/|src/app/screens/vj/|src/app/screens/editor/([Pp]review|stage)|src/app/state/(stills|tilePreview)\.ts|tests/e2e/([^/]*($specs)[^/]*|fixtures\.ts|global-setup\.ts)$|public/[^/]+$|scripts/|\.github/|package(-lock)?\.json$|playwright\.config\.ts$|vite\.config\.ts$|tsconfig|index\.html$|\.nvmrc$)"
            changed=$(git diff --name-only HEAD^1 HEAD)
            if ! printf '%s\n' "$changed" | grep -qE "$paths"; then
              echo "::notice::No changes to the preview host, engine, media, shared code or test setup; skipping the main-thread leg."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/node-deps
      - name: Give apt download retries and timeouts
        if: steps.scope.outputs.run == 'true'
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install Chromium for Playwright
        if: steps.scope.outputs.run == 'true'
        # apt-get update can hang silently on a stalled mirror. `timeout` ends a stuck attempt so the next one retries.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # Playwright runs `sudo -- sh -c "apt-get update && apt-get install …"`. The timeout's signal reaches that
              # sh but not the apt-get it started, which runs on as root holding apt's lock, so stop it here. Then finish
              # anything a cut-off install left half configured.
              sudo pkill -x apt-get || true
              sleep $(((attempt - 1) * 20))
              sudo pkill -KILL -x apt-get || true
              sudo timeout -k 10 120 dpkg --configure -a || true
            fi
            timeout -k 10 240 npx playwright install --with-deps chromium && exit 0
          done
          exit 1
      - name: Install ffmpeg (test fixtures and export verification)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo pkill -x apt-get || true
              sleep $(((attempt - 1) * 20))
              sudo pkill -KILL -x apt-get || true
              sudo timeout -k 10 120 dpkg --configure -a || true
            fi
            sudo timeout -k 10 120 apt-get update &&
              sudo timeout -k 10 480 apt-get install -y --no-install-recommends ffmpeg &&
              exit 0
          done
          exit 1
      - if: steps.scope.outputs.run == 'true'
        run: npm run build
      - if: steps.scope.outputs.run == 'true' && matrix.preview == 'worker'
        run: npx playwright test
        env:
          E2E_HALF: ${{ matrix.half }}
      - if: steps.scope.outputs.run == 'true' && matrix.preview == 'main'
        run: npx playwright test $MAIN_THREAD_SPECS
        env:
          E2E_PREVIEW_WORKER: '0'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.preview }}${{ matrix.half }}
          path: |
            playwright-report
            test-results
          retention-days: 7
